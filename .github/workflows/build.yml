name: build

# Every push and PR runs three things:
#   - the JVM unit tests and a real debug APK build. The mesh golden test is
#     the regression net for the depth-banding fix, so a refactor of the blur or
#     the sampling cannot land without a red build.
#   - check-parity: every path AGENTS.md mentions must exist, and the constants
#     the reference WebGL port and the Android app must still agree.
#   - check-shaders: every GLSL shader the app keeps in Java compiles. The Android
#     build cannot see this -- shaders compile at runtime on the GL thread -- and
#     a reserved word in one has already crashed both the studio and the live
#     wallpaper on a real phone.
#
# Uses the same containerised Gradle path as `android/podman-build.sh` — the
# host needs nothing but podman, which ubuntu-latest already has.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guards:
    name: guards (docs + port parity)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No package install: the script is plain Node with no dependencies, so this
      # stays fast and cannot break for an unrelated reason.
      - name: AGENTS.md links + web/Android parity
        run: node scripts/check-parity.mjs
      # Device-only trap: :core compiles against Maven's org.json, which has
      # put(String, float); Android's platform org.json does not. A bare float
      # put passes both Android gates and throws NoSuchMethodError on the phone.
      - name: org.json float puts
        run: node scripts/check-json-puts.mjs
      - name: Shaders compile (glslangValidator)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          node scripts/check-shaders.mjs

  android:
    name: android (unit tests + debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          java -version 2>&1 | head -1
          podman --version

      - name: Build the Android SDK image
        run: ./android/podman-build.sh build-image

      # Runs :core:test on its own. Fast, and fails with a useful message
      # rather than being buried in an APK build.
      - name: Unit tests (:core)
        run: ./android/podman-build.sh test

      - name: Build debug APK
        run: ./android/podman-build.sh build-apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  web:
    # The port is under reference/ and is NOT maintained in sync with the app.
    # The job exists only so the reference keeps compiling; it is not a product
    # gate. Package manager is pnpm, the repository convention.
    name: reference web port (vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: reference/webgl-port
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: reference/webgl-port/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
