name: build

# Every push and PR runs these things:
#   - the JVM unit tests and a real debug APK build. The mesh golden test is
#     the regression net for the depth-banding fix, so a refactor of the blur or
#     the sampling cannot land without a red build.
#   - check-parity: every path AGENTS.md mentions must exist, and the constants
#     the reference WebGL port and the Android app must still agree.
#   - check-shaders: every GLSL shader the app keeps in Java compiles. The Android
#     build cannot see this -- shaders compile at runtime on the GL thread -- and
#     a reserved word in one has already crashed both the studio and the live
#     wallpaper on a real phone.
#   - the shared `contract/` fixtures: the rules implemented more than once (the
#     tag rule, the dePH chunk, the splat sidecar) are tested against ONE set of
#     golden bytes by each language. The JS half runs in `guards`, the Java half in
#     the android job, the TypeScript half (the `web/` gallery's reader) in the
#     web-app job, and the node's Python half in its own container job -- the
#     node had no CI at all before this.
#
#   - the `web/` gallery is a product, not the reference port: its dePH fixture
#     test is a gate exactly as the port's is, and the typecheck/build catch what
#     `pnpm test` cannot see.
#
# Uses the same containerised Gradle path as `android/podman-build.sh` — the
# host needs nothing but podman, which ubuntu-latest already has.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Which jobs have anything to do.
  #
  # The lists are the JOBS' INPUTS, not their folders -- derived from what each
  # build actually reads, so a change that cannot affect a job does not run it:
  #
  #   android          android/**, contract/**   (core/build.gradle passes
  #                                               basrelief.contract to :core:test,
  #                                               podman-build.sh mounts contract/)
  #   web-app          web/**, contract/**       (web/src/deph.test.ts is the
  #                                               contract's third implementation)
  #   web              reference/**              (the reference port, not the gallery)
  #   python-contract  server/**, contract/**    (the node's fixture test)
  #   guards           everything -- check-parity parses AGENTS.md, contract/,
  #                    web/src and the Android sources, so it never filters.
  #
  # `scripts/**` is NOT an input to android or web: the scripts are run by guards,
  # in Node, on the host. Adding them "to be safe" would be the unconfident move
  # this file's comments keep warning about.
  changes:
    name: changed inputs
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.diff.outputs.android }}
      webapp: ${{ steps.diff.outputs.webapp }}
      reference: ${{ steps.diff.outputs.reference }}
      server: ${{ steps.diff.outputs.server }}
      all: ${{ steps.diff.outputs.all }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff needs history: a shallow clone cannot resolve github.event.before.
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          set_area() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # A first push or a force-push has no comparable base. That is a fact
          # about the event, not a doubt about the lists, so everything runs.
          if [ -z "$base" ] \
             || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            for k in android webapp reference server; do set_area "$k" true; done
            set_area all true
            echo "no comparable base ($base); running every job" >&2
            exit 0
          fi
          files=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "changed:"; printf '%s\n' "$files" | head -40
          has() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          set_area android   "$(has '^android/|^contract/')"
          set_area webapp    "$(has '^web/|^contract/')"
          set_area reference "$(has '^reference/')"
          set_area server    "$(has '^server/|^contract/')"
          # A workflow change is not covered by any input list, and a workflow that
          # cannot be trusted to run is worth nothing: run everything.
          set_area all       "$(has '^\.github/workflows/')" 

  guards:
    name: guards (docs + port parity)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No package install: the script is plain Node with no dependencies, so this
      # stays fast and cannot break for an unrelated reason.
      - name: AGENTS.md links + web/Android parity
        run: node scripts/check-parity.mjs
      # Device-only trap: :core compiles against Maven's org.json, which has
      # put(String, float); Android's platform org.json does not. A bare float
      # put passes both Android gates and throws NoSuchMethodError on the phone.
      - name: org.json float puts
        run: node scripts/check-json-puts.mjs
      - name: Shaders compile (glslangValidator)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          node scripts/check-shaders.mjs
      # The JS half of contract/deph/. Plain Node: png-depth.js touches no browser
      # API, so it loads unmodified and no install step is needed.
      - name: Shared contract fixtures (JS)
        run: node contract/deph/png-depth.test.mjs

  android:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.android == 'true'
    name: android (unit tests + debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          java -version 2>&1 | head -1
          podman --version

      - name: Build the Android SDK image
        run: ./android/podman-build.sh build-image

      # Runs :core:test on its own. Fast, and fails with a useful message
      # rather than being buried in an APK build.
      - name: Unit tests (:core)
        run: ./android/podman-build.sh test

      - name: Build debug APK
        run: ./android/podman-build.sh build-apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  python-contract:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.server == 'true'
    # The ComfyUI node had NO CI job before the shared contract/ fixtures existed.
    # This one runs only the contract test, which is why it needs nothing but a
    # bare Python image: basrelief_depth/contract.py imports no torch, numpy,
    # ComfyUI or folder_paths, and the test loads it by path so importing the
    # package (and its heavy __init__) never happens. No pip step, nothing to break.
    #
    # Local equivalent:
    #   podman run --rm -v "$PWD:/w:ro" -w /w python:3.12-slim \
    #       python3 server/comfy-node/tests/test_contract.py
    name: comfy node contract (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: Shared contract fixtures (Python)
        run: python3 server/comfy-node/tests/test_contract.py

  web:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.reference == 'true'
    # The port is under reference/ and is NOT maintained in sync with the app.
    # The job exists only so the reference keeps compiling; it is not a product
    # gate. Package manager is pnpm, the repository convention.
    name: reference web port (vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: reference/webgl-port
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: reference/webgl-port/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  web-app:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.webapp == 'true'
    # The gallery is a product. Its dePH reader is the contract's third
    # implementation, so its fixture test is a real gate; the typecheck and the
    # production build catch a broken import or a DOM type that the fixture test
    # cannot see. (No browser is needed: the reader and the media classifier are
    # plain values.)
    name: web gallery (fixtures + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      # The build emits the notices for what the bundle actually contains. A
      # licence file nobody checks is indistinguishable from one that silently
      # stopped listing a dependency, so hold it to the one dependency that must
      # be in there, and to a non-empty file.
      - name: Third-party notices shipped
        run: |
          test -s dist/THIRD-PARTY.txt
          grep -q '^Name: three' dist/THIRD-PARTY.txt
          grep -q 'The MIT License' dist/THIRD-PARTY.txt
