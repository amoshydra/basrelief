// Pure-JVM rendering core: depth->geometry and the camera model.
//
// Deliberately has NO Android dependencies (not even AndroidX) so it can be
// unit-tested on a plain JVM without a device or instrumentation runner.
// The renderer shell in :app depends on this; nothing here depends on :app.
//
// JUnit is `testImplementation` only — it is not packaged into the APK, so the
// "no runtime dependencies" property of this module is preserved.
//
// org.json is `compileOnly` + `testImplementation`: on a device it comes from
// the platform, and neither scope is packaged, so :core still ships with zero
// runtime dependencies. Tests parse the JSON rather than comparing strings,
// because Android's org.json and Maven's disagree on key order.
plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    compileOnly 'org.json:json:20231013'
    testImplementation 'org.json:json:20231013'
    testImplementation 'junit:junit:4.13.2'
}

// The shared contract fixtures live at the REPOSITORY root, while this Gradle
// build's root is android/. The test working directory is android/core, so a
// ../../ chain would be a path that depends on where Gradle was invoked from; the
// directory is passed in instead. In the container only android/ is mounted at
// /workspace (so rootProject's parent is /), which is why podman-build.sh also
// mounts ./contract at /contract. Override with -PcontractDir=<path>.
def contractDir = (project.findProperty('contractDir')
        ?: new File(rootProject.projectDir.parentFile, 'contract').absolutePath)

test {
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
    systemProperty 'basrelief.contract', contractDir
    // A property alone would let Gradle cache a green run ACROSS a fixture edit:
    // the expected value lives in an untracked-by-Gradle directory, so a changed
    // expectation would not be checked until something else forced a rerun. The
    // directory is declared as an input so it is.
    if (file(contractDir).isDirectory()) {
        inputs.dir(contractDir)
                .withPropertyName('contractFixtures')
                .withPathSensitivity(PathSensitivity.RELATIVE)
    }
}
