// Pure-JVM rendering core: depth->geometry and the camera model.
//
// Deliberately has NO Android dependencies (not even AndroidX) so it can be
// unit-tested on a plain JVM without a device or instrumentation runner.
// The renderer shell in :app depends on this; nothing here depends on :app.
//
// JUnit is `testImplementation` only — it is not packaged into the APK, so the
// "no runtime dependencies" property of this module is preserved.
//
// org.json is `compileOnly` + `testImplementation`: on a device it comes from
// the platform, and neither scope is packaged, so :core still ships with zero
// runtime dependencies. Tests parse the JSON rather than comparing strings,
// because Android's org.json and Maven's disagree on key order.
plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    compileOnly 'org.json:json:20231013'
    testImplementation 'org.json:json:20231013'
    testImplementation 'junit:junit:4.13.2'
}

test {
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
