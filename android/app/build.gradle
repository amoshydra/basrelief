plugins {
    id 'com.android.application'
}

// Optional release signing. keystore.properties + *.keystore are gitignored;
// without them, `assembleRelease` produces an unsigned APK and `assembleDebug`
// still works normally.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// The commit this build is from, for BuildConfig.GIT_COMMIT. Short, and "unknown" when
// git is unavailable -- a build must not depend on the VCS being present.
def gitCommit() {
    // From the ENVIRONMENT FIRST: builds run inside a container that has no git and no
    // .git, so a lookup here always answered "unknown" and the log line said so. The
    // wrapper script resolves it on the host and passes it in. The local lookup stays as
    // a fallback for a build run outside the container.
    def fromEnv = System.getenv('BASRELIEF_GIT_COMMIT')
    if (fromEnv != null && !fromEnv.trim().isEmpty()) return fromEnv.trim()
    try {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = out
            ignoreExitValue = true
        }
        def sha = out.toString().trim()
        return sha.isEmpty() ? 'unknown' : sha
    } catch (Exception ignored) {
        return 'unknown'
    }
}

android {
    namespace 'com.amoshydra.basrelief'
    compileSdk 36
    // pin to what the container image ships, so builds don't silently
    // download a different build-tools version
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "com.amoshydra.basrelief"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        // WHICH COMMIT THIS APK WAS BUILT FROM, so a log line can say it and nobody has to
        // guess whether the phone is running the build they just made. Asked for after a
        // session where "is the new APK actually installed" was a real question four
        // times, and where the only way to tell was comparing byte sizes and timestamps.
        //
        // Resolved here, at configuration time, and never failing: a build from an export
        // with no .git, or with git absent from the container, must produce "unknown"
        // rather than break.
        buildConfigField "String", "GIT_COMMIT", "\"${gitCommit()}\""
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildFeatures {
        // Off by default in AGP 8, and the commit field above needs it.
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKeystore ? signingConfigs.release : null
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // bundled demo assets are already-compiled PNGs; keep them compressed
    androidResources {
        noCompress 'png'
    }
}

// The renderer shell depends on the pure-JVM core (depth->geometry + camera
// model), which is where the unit tests live.
//
// The golden test pins the exact mesh output, so a refactor of the depth blur
// or the sampling convention cannot silently reintroduce the banding artifact.
// Make every APK build depend on it: there is no way to produce a shippable
// artifact without the tests having passed.
tasks.matching { it.name.startsWith('assemble') || it.name.startsWith('bundle') }
        .configureEach { it.dependsOn ':core:test' }

dependencies {
    implementation project(':core')
}
