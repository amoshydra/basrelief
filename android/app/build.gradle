plugins {
    id 'com.android.application'
}

// Optional release signing. keystore.properties + *.keystore are gitignored;
// without them, `assembleRelease` produces an unsigned APK and `assembleDebug`
// still works normally.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.amoshydra.basrelief'
    compileSdk 36
    // pin to what the container image ships, so builds don't silently
    // download a different build-tools version
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "com.amoshydra.basrelief"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKeystore ? signingConfigs.release : null
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // bundled demo assets are already-compiled PNGs; keep them compressed
    androidResources {
        noCompress 'png'
    }
}

// The renderer shell depends on the pure-JVM core (depth->geometry + camera
// model), which is where the unit tests live.
//
// The golden test pins the exact mesh output, so a refactor of the depth blur
// or the sampling convention cannot silently reintroduce the banding artifact.
// Make every APK build depend on it: there is no way to produce a shippable
// artifact without the tests having passed.
tasks.matching { it.name.startsWith('assemble') || it.name.startsWith('bundle') }
        .configureEach { it.dependsOn ':core:test' }

dependencies {
    implementation project(':core')
}
